name: Govt Job Alert Bot

on:
  schedule:
    # ಪ್ರತಿ 1 ಗಂಟೆಗೆ ಒಮ್ಮೆ ತಾನಾಗಿಯೇ ರನ್ ಆಗಲು (Every 1 hour)
    - cron: '0 * * * *'
  # ಬೇಕಾದಾಗ ಮ್ಯಾನುವಲ್ ಆಗಿ Run ಬಟನ್ ಒತ್ತಿ ಚೆಕ್ ಮಾಡಲು
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 urllib3

    - name: Run Python Bot
      run: python bot.py

    - name: Save and Push seen jobs history
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add seen_jobs.json || true
        git commit -m "Update seen jobs list" || true
        git push || true
